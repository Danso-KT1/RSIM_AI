<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle tech border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.35" />

  <!-- Inner crest badge -->
  <circle cx="256" cy="230" r="140" fill="#042f2e" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Directorate Institutional Emblem Pillars & Eagle/Star -->
  <!-- Central building / directorate columns -->
  <g transform="translate(156, 130)">
    <!-- Pediment (Triangle Roof) -->
    <polygon points="100,20 10,65 190,65" fill="url(#goldGrad)" />
    <!-- Golden Star in Pediment -->
    <polygon points="100,32 104,44 116,44 106,51 110,62 100,55 90,62 94,51 84,44 96,44" fill="#ffffff" />
    
    <!-- Architrave beam -->
    <rect x="15" y="68" width="170" height="12" rx="3" fill="#ffffff" fill-opacity="0.9" />
    
    <!-- 4 Directorate Pillars -->
    <rect x="25" y="85" width="22" height="90" rx="4" fill="url(#emeraldGrad)" />
    <rect x="68" y="85" width="22" height="90" rx="4" fill="url(#emeraldGrad)" />
    <rect x="110" y="85" width="22" height="90" rx="4" fill="url(#emeraldGrad)" />
    <rect x="153" y="85" width="22" height="90" rx="4" fill="url(#emeraldGrad)" />
    
    <!-- Base plinth -->
    <rect x="10" y="178" width="180" height="18" rx="4" fill="url(#goldGrad)" />
  </g>

  <!-- AI Sparkle Cluster -->
  <g transform="translate(325, 125)" filter="url(#glow)">
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="#34d399" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
  <g transform="translate(145, 290)">
    <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#fbbf24" />
  </g>

  <!-- Quill / Pen Writing Accent -->
  <path d="M 330,280 L 365,245 C 372,238 382,238 388,245 C 394,251 394,261 388,267 L 350,305 L 325,310 Z" fill="url(#goldGrad)" />

  <!-- Platform Title Typography -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">RSIM AI</text>
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="19" fill="#34d399" text-anchor="middle" letter-spacing="3">DIRECTORATE PWA</text>
</svg>
